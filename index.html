
<!DOCTYPE html>
<html>
<head>
    <title>User Login Validation</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg,#dbeafe,#ede9fe);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login {
            background: white;
            padding: 35px;
            width: 330px;
            border-radius: 15px;
            box-shadow: 0 10px 30px #0002;
        }

        h1 {
            text-align: center;
            color: #4f46e5;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        #message {
            text-align: center;
            color: red;
            margin-top: 15px;
        }

        .demo {
            margin-top: 20px;
            background: #f1f2ff;
            padding: 12px;
            font-size: 12px;
            line-height: 1.8;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="login">

    <h1>User Login</h1>

    <form id="loginForm">

        <label>Login Name</label>
        <input type="text" id="username"
               placeholder="Enter username" required>

        <label>Password</label>
        <input type="password" id="password"
               placeholder="Enter password" required>

        <button type="submit">Login</button>

        <p id="message"></p>

    </form>

    <div class="demo">
        <b>Demo Credentials:</b><br>
        Username: admin<br>
        Password: admin123
    </div>

</div>

<script>

    // Database records (demo)
    let database = [
        {username: "admin", password: "admin123"},
        {username: "student", password: "student123"},
        {username: "darshan", password: "12345"}
    ];

    document.getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        let username =
            document.getElementById("username").value;

        let password =
            document.getElementById("password").value;

        let user = database.find(function(record) {
            return record.username === username &&
                   record.password === password;
        });

        if (user) {
            sessionStorage.setItem("loggedInUser", username);
            window.location.href = "success.html";
        }
        else {
            document.getElementById("message").innerHTML =
            "Invalid username or password!";
        }

    });

</script>

</body>
</html>
